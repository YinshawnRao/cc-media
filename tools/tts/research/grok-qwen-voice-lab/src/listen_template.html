<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>__TITLE__</title>
<style>
:root{--bg:#090b12;--panel:#141824;--line:#2a3144;--text:#f5f7ff;--muted:#98a3bd;--accent:#82f7cb;--hot:#ff8ec7;--blue:#86b8ff;--tab:#171d2c}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 12% 0,#273154 0,transparent 32rem),radial-gradient(circle at 90% 10%,#3a1832 0,transparent 28rem),var(--bg);color:var(--text);font:15px/1.55 system-ui,-apple-system,sans-serif}
main{width:min(1420px,94vw);margin:auto;padding:48px 0 140px}
header{max-width:980px}
h1{font-size:clamp(34px,5vw,64px);line-height:1.05;margin:0 0 14px}
.lead{font-size:17px;color:var(--muted)}
.compare{color:var(--accent);font-weight:700}
.notice{margin:22px 0;padding:14px 17px;border:1px solid #3a4968;background:#111827cc;border-radius:14px}
.controls{position:sticky;top:0;z-index:4;background:#090b12f2;backdrop-filter:blur(16px);padding:14px 0 12px;margin:26px 0 20px;border-bottom:1px solid var(--line)}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tabs button{flex:1;min-width:110px;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--tab);color:var(--text);font:inherit;cursor:pointer}
.tabs button.active{background:var(--accent);color:#082218;border-color:var(--accent);font-weight:700}
input{width:100%;padding:13px 15px;background:#121725;border:1px solid var(--line);border-radius:12px;color:var(--text);font:inherit;margin-bottom:10px}
.buttons{display:flex;flex-wrap:wrap;gap:8px}
.buttons button{border:1px solid var(--line);background:#171d2c;color:var(--text);padding:8px 11px;border-radius:999px;cursor:pointer}
.buttons button.active{background:var(--blue);color:#07101d;border-color:var(--blue)}
.count{color:var(--accent);margin:10px 0 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:15px}
.card{background:linear-gradient(145deg,#181e2d,#10141f);border:1px solid var(--line);border-radius:18px;padding:17px;box-shadow:0 18px 40px #0005;position:relative}
.card[hidden]{display:none}
.card.picked{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
small{color:var(--accent)}
h3{font-size:20px;margin:2px 0 0}
.code{font:700 13px/1.2 ui-monospace,SFMono-Regular,monospace;color:var(--hot);letter-spacing:.04em}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:11px 0}
i{font-style:normal;font-size:11px;padding:3px 8px;background:#29314a;border-radius:999px;color:#cbd5ef}
.card>p{color:var(--muted);min-height:64px;margin:10px 0 13px}
.player span{display:block;font-size:11px;color:var(--hot);margin:7px 0 4px}
audio{width:100%;height:38px}
details{margin-top:9px}
summary{color:var(--muted);cursor:pointer;font-size:12px}
.meta{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:10px}
code{color:#687792;font-size:11px}
.pick{border:1px solid var(--line);background:#171d2c;color:var(--text);border-radius:999px;padding:6px 10px;cursor:pointer;font:12px/1 system-ui}
.card.picked .pick{background:var(--accent);color:#082218;border-color:var(--accent)}
.shortlist{position:fixed;left:0;right:0;bottom:0;z-index:6;background:#0c101ae8;backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:10px 4vw}
.shortlist inner,.shortlist .row{width:min(1420px,94vw);margin:auto;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.shortlist b{color:var(--accent)}
.shortlist span{color:var(--muted);flex:1;min-width:180px;word-break:break-all}
.shortlist button{border:1px solid var(--accent);background:transparent;color:var(--accent);border-radius:999px;padding:8px 12px;cursor:pointer}
@media(max-width:640px){main{padding-top:28px}.grid{grid-template-columns:1fr}.card>p{min-height:0}.tabs{flex-direction:column}}
</style>
</head>
<body>
<main>
<header>
<h1>__HEADING__</h1>
<p class="lead">__LEAD__</p>
__COMPARE__
<div class="notice"><strong>同文案公平比较 · 选定后再替换正式池</strong><br>每张卡有稳定编号（GX-F01 / GX-M01）。先听“统一解说文案”，再展开母带和中英日混读。标记喜欢的编号后复制给我。试听副本 24kHz 单声道并做响度匹配。机械 QA：__QA__。本页不改当前 5 男 5 女正式池。</div>
</header>
<section class="controls">
  <div class="tabs">
    <button class="active" data-tab="all">全部 100</button>
    <button data-tab="female">女声 GX-F01–F50</button>
    <button data-tab="male">男声 GX-M01–M50</button>
  </div>
  <input id="search" type="search" placeholder="搜索编号、名字、情绪：GX-F12、砂砾、反派、电竞、祖母……">
  <div class="buttons" id="cats">
    <button class="active" data-filter="all">全部分类</button>
    __CATEGORY_BUTTONS__
  </div>
  <p class="count" id="count"></p>
</section>
<section class="grid" id="grid">__CARDS__</section>
</main>
<div class="shortlist"><div class="row"><b>已标记</b><span id="picked">还没有标记。点卡片右下角“标记编号”。</span><button type="button" id="copy">复制编号</button><button type="button" id="clear">清空</button></div></div>
<script>
const cards=[...document.querySelectorAll('.card')];
const tabs=[...document.querySelectorAll('.tabs button')];
const catButtons=[...document.querySelectorAll('#cats button')];
const search=document.querySelector('#search');
const count=document.querySelector('#count');
const pickedEl=document.querySelector('#picked');
const KEY='grok-qwen-voice-lab-shortlist';
let tab='all';
let cat='all';
let picked=new Set(JSON.parse(localStorage.getItem(KEY)||'[]'));
function renderPicked(){
  const ids=[...picked];
  pickedEl.textContent=ids.length?ids.join('  '):'还没有标记。点卡片右下角“标记编号”。';
  cards.forEach(card=>{
    const on=picked.has(card.dataset.code);
    card.classList.toggle('picked',on);
    card.querySelector('.pick').textContent=on?'已标记':'标记编号';
  });
}
function render(){
  const q=search.value.trim().toLowerCase();
  let shown=0;
  for(const card of cards){
    let ok=tab==='all'||card.dataset.group===tab;
    if(cat!=='all') ok=ok&&card.dataset.category===cat;
    ok=ok&&(!q||card.dataset.search.includes(q));
    card.hidden=!ok;
    if(ok) shown++;
  }
  count.textContent=`当前显示 ${shown} / ${cards.length} 种声线`;
}
tabs.forEach(button=>button.addEventListener('click',()=>{
  tabs.forEach(item=>item.classList.remove('active'));
  button.classList.add('active');
  tab=button.dataset.tab;
  render();
}));
catButtons.forEach(button=>button.addEventListener('click',()=>{
  catButtons.forEach(item=>item.classList.remove('active'));
  button.classList.add('active');
  cat=button.dataset.filter;
  render();
}));
search.addEventListener('input',render);
cards.forEach(card=>card.querySelector('.pick').addEventListener('click',()=>{
  const code=card.dataset.code;
  if(picked.has(code)) picked.delete(code); else picked.add(code);
  localStorage.setItem(KEY,JSON.stringify([...picked]));
  renderPicked();
}));
document.querySelector('#copy').addEventListener('click',async()=>{
  const text=[...picked].join('\n');
  if(!text) return;
  await navigator.clipboard.writeText(text);
  document.querySelector('#copy').textContent='已复制';
  setTimeout(()=>document.querySelector('#copy').textContent='复制编号',1200);
});
document.querySelector('#clear').addEventListener('click',()=>{
  picked=new Set();
  localStorage.removeItem(KEY);
  renderPicked();
});
document.querySelectorAll('audio').forEach(player=>player.addEventListener('play',()=>{
  document.querySelectorAll('audio').forEach(other=>{if(other!==player)other.pause();});
}));
if(location.hash){
  const target=location.hash.slice(1).toLowerCase();
  const card=cards.find(item=>item.dataset.code.toLowerCase()===target||item.id===target);
  if(card){tab=card.dataset.group;tabs.forEach(b=>b.classList.toggle('active',b.dataset.tab===tab||(tab!=='all'&&b.dataset.tab===card.dataset.group)));card.scrollIntoView({behavior:'smooth',block:'center'});}
}
render();
renderPicked();
</script>
</body>
</html>
