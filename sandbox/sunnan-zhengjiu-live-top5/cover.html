<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1080,height=1920">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#050507;font-family:"Noto Sans SC","PingFang SC",system-ui,sans-serif;color:#fff}
#cover{position:relative;width:1080px;height:1920px;overflow:hidden;background:#050507}
.side{position:absolute;top:0;width:540px;height:1920px;object-fit:cover;filter:contrast(1.18) saturate(1.05) brightness(.78)}
.left{left:0;object-position:center}.right{right:0;object-position:center}
.shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.72),rgba(0,0,0,.18) 38%,rgba(0,0,0,.88)),radial-gradient(70% 56% at 50% 48%,rgba(240,209,138,.16),rgba(0,0,0,0) 60%)}
.split{position:absolute;left:531px;top:238px;width:18px;height:1420px;background:linear-gradient(180deg,rgba(244,215,137,0),#f4d789 18%,#fff 50%,#f4d789 82%,rgba(244,215,137,0));box-shadow:0 0 44px rgba(244,215,137,.82)}
.line{position:absolute;left:54px;right:54px;height:6px;background:#f4d789;box-shadow:0 0 30px rgba(244,215,137,.46)}
.line.top{top:138px}.line.bottom{bottom:204px}
.kicker{position:absolute;left:72px;top:214px;font-size:34px;font-weight:900;letter-spacing:.2em;color:#f4d789;text-shadow:0 6px 28px #000}
.title{position:absolute;left:70px;right:70px;top:282px;font-weight:1000;line-height:1.02;text-shadow:0 12px 44px rgba(0,0,0,.86)}
.title .song{display:block;font-size:106px;color:#fff}
.title .question{display:block;margin-top:14px;font-size:82px;color:#f4d789}
.subtitle{position:absolute;left:70px;right:70px;bottom:292px;text-align:center;font-size:52px;font-weight:1000;color:#fff;text-shadow:0 8px 34px #000}
.badge{position:absolute;left:50%;bottom:224px;transform:translateX(-50%);padding:12px 24px;border:2px solid rgba(244,215,137,.62);background:rgba(0,0,0,.50);font-size:34px;font-weight:900;letter-spacing:.12em;color:#f4d789}
</style>
</head>
<body>
<div id="cover" data-cover-id="cover" data-start="0" data-duration="1" data-width="1080" data-height="1920">
  <img class="clip side left" data-start="0" data-duration="1" data-track-index="0" src="assets/cover_left.png" alt="">
  <img class="clip side right" data-start="0" data-duration="1" data-track-index="1" src="assets/cover_right.png" alt="">
  <div class="clip shade" data-start="0" data-duration="1" data-track-index="2"></div>
  <div class="clip split" data-start="0" data-duration="1" data-track-index="3"></div>
  <div class="clip line top" data-start="0" data-duration="1" data-track-index="4"></div>
  <div class="clip line bottom" data-start="0" data-duration="1" data-track-index="5"></div>
  <div class="clip kicker" data-start="0" data-duration="1" data-track-index="6">华语LIVE封神盘点</div>
  <h1 class="clip title" data-start="0" data-duration="1" data-track-index="7">
    <span class="song">孙楠《拯救》</span>
    <span class="question">最强Live是哪一版？</span>
  </h1>
  <div class="clip subtitle" data-start="0" data-duration="1" data-track-index="8">原Key巅峰 vs 55岁直播</div>
  <div class="clip badge" data-start="0" data-duration="1" data-track-index="9">只看现场完成度</div>
</div>
<script>
window.__timelines = window.__timelines || {};
window.__timelines.cover = gsap.timeline({ paused: true });
</script>
</body>
</html>
