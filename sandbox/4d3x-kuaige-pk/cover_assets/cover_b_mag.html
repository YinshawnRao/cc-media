<!doctype html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700;800;900&family=Noto+Sans+SC:wght@500;700;800;900&family=Cormorant+Garamond:ital,wght@1,300;1,400;1,600&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1080px; height: 1440px; overflow: hidden;
  font-family: "Noto Sans SC", sans-serif; color: #1A1018;
  background: linear-gradient(180deg, #F4ECE2 0%, #E9DBCB 100%); }
.tex { position: absolute; inset: 0;
  background-image: radial-gradient(circle at 12% 22%, rgba(0,0,0,.04) 0 .8px, transparent 1.2px),
                    radial-gradient(circle at 78% 64%, rgba(0,0,0,.03) 0 .8px, transparent 1.2px),
                    radial-gradient(circle at 38% 88%, rgba(0,0,0,.04) 0 .8px, transparent 1.2px);
  background-size: 240px 240px, 200px 200px, 280px 280px; opacity: .55; }
.silver { position: absolute; inset: 0;
  background: linear-gradient(115deg, rgba(220,210,205,.50) 0%, rgba(255,250,245,.18) 40%, rgba(220,205,210,.45) 100%);
  mix-blend-mode: overlay; opacity: .60; }
.bar-top { position: absolute; top: 70px; left: 70px; right: 70px;
  border-bottom: 2.5px solid #1A1018; padding-bottom: 22px;
  display: flex; align-items: baseline; justify-content: space-between;
  font-family: "Noto Sans SC", sans-serif; font-size: 24px; font-weight: 800;
  letter-spacing: .36em; color: #1A1018; }
.bar-top .ed { color: #C9486E; }

.italic-eyebrow { position: absolute; top: 168px; left: 0; right: 0; text-align: center;
  font-family: "Cormorant Garamond", serif; font-style: italic; font-weight: 400;
  font-size: 38px; color: rgba(26,16,24,.62); letter-spacing: .05em; }

.massive { position: absolute; top: 218px; left: 0; right: 0; text-align: center; z-index: 4; }
.m1 { display: block; font-family: "Noto Serif SC", serif; font-size: 158px;
  font-weight: 900; line-height: .96; letter-spacing: -3px; color: #1A1018;
  text-shadow: 0 6px 22px rgba(201,72,110,.18); }
.m2 { display: block; font-family: "Noto Serif SC", serif; font-size: 92px;
  font-weight: 700; line-height: 1.0; color: #C9486E; letter-spacing: .14em; margin-top: 4px; }
.m3 { display: block; font-family: "Bebas Neue", serif; font-size: 184px;
  font-weight: 900; color: #1A1018; letter-spacing: .04em; line-height: .98;
  margin-top: -6px; text-shadow: 0 8px 20px rgba(201,72,110,.22); }

.lede { position: absolute; top: 808px; left: 0; right: 0; text-align: center;
  font-family: "Noto Sans SC", sans-serif; font-size: 32px; font-weight: 700;
  color: #1A1018; letter-spacing: .22em; }
.lede .lede-dot { color: #C9486E; padding: 0 12px; }

.names-grid { position: absolute; top: 880px; left: 70px; right: 70px;
  display: grid; grid-template-columns: 1fr 1fr; gap: 8px 18px; z-index: 3; }
.nrow { display: flex; align-items: baseline; gap: 12px;
  padding: 12px 0; border-bottom: 1.5px solid rgba(26,16,24,.16); }
.nrow:nth-child(7) { grid-column: 1 / -1; justify-content: center;
  border-bottom: 2.5px solid #C9486E; border-top: 2.5px solid #C9486E;
  padding: 16px 0; margin-top: 6px; background: rgba(201,72,110,.06); }
.nrow .ni { font-family: "Bebas Neue"; font-size: 28px; font-weight: 900;
  color: #C9486E; min-width: 38px; }
.nrow .nm { font-family: "Noto Sans SC", sans-serif; font-size: 28px; font-weight: 800;
  color: #1A1018; }
.nrow .ns { font-family: "Noto Serif SC", serif; font-size: 24px; font-weight: 500;
  color: rgba(26,16,24,.62); margin-left: 6px; }
.nrow .nt { font-family: "Noto Sans SC", sans-serif; font-size: 18px; font-weight: 700;
  color: #C9486E; margin-left: auto; padding: 3px 10px; border: 1.5px solid #C9486E;
  border-radius: 999px; letter-spacing: .12em; }

.foot { position: absolute; bottom: 50px; left: 70px; right: 70px;
  border-top: 2.5px solid #1A1018; padding-top: 16px;
  display: flex; align-items: baseline; justify-content: space-between;
  font-family: "Cormorant Garamond", serif; font-style: italic; font-weight: 400;
  font-size: 26px; color: rgba(26,16,24,.55); letter-spacing: .04em; }
.foot .vote { color: #C9486E; font-family: "Noto Sans SC", sans-serif;
  font-style: normal; font-weight: 800; letter-spacing: .28em; font-size: 22px; }
</style>
</head>
<body>
  <div class="tex"></div>
  <div class="silver"></div>

  <div class="bar-top">
    <div>POP<span style="margin: 0 12px; color: #C9486E;">·</span>RANKED</div>
    <div class="ed">VOL.01</div>
  </div>

  <div class="italic-eyebrow">— the Millennium Dance-Pop Showdown —</div>

  <div class="massive">
    <span class="m1">四大三小</span>
    <span class="m2">快歌</span>
    <span class="m3">PK</span>
  </div>

  <div class="lede">每人 1 首<span class="lede-dot">·</span>你来投票</div>

  <div class="names-grid">
    <div class="nrow"><span class="ni">01</span><span class="nm">蔡依林</span><span class="ns">《舞娘》</span><span class="nt">唱跳</span></div>
    <div class="nrow"><span class="ni">02</span><span class="nm">萧亚轩</span><span class="ns">《爱的主打歌》</span><span class="nt">律动</span></div>
    <div class="nrow"><span class="ni">03</span><span class="nm">孙燕姿</span><span class="ns">《超快感》</span><span class="nt">摇滚</span></div>
    <div class="nrow"><span class="ni">04</span><span class="nm">梁静茹</span><span class="ns">《燕尾蝶》</span><span class="nt">起飞</span></div>
    <div class="nrow"><span class="ni">05</span><span class="nm">王心凌</span><span class="ns">《Honey》</span><span class="nt">甜心</span></div>
    <div class="nrow"><span class="ni">06</span><span class="nm">张韶涵</span><span class="ns">《That Girl》</span><span class="nt">电子</span></div>
    <div class="nrow"><span class="ni">07</span><span class="nm">杨丞琳</span><span class="ns">《新流感》</span><span class="nt">甜酷</span></div>
  </div>

  <div class="foot">
    <div>— Issue 01 / Fast Songs —</div>
    <div class="vote">VOTE → 投票区</div>
  </div>
</body>
</html>
