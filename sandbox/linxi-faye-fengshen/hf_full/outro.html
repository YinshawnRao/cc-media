<div class="otblk clip" id="otext" data-start="0" data-duration="40.95" data-track-index="17"><div class="ot-bg"></div><div class="ot-rule"></div><div class="ot-1">林夕给了王菲语言</div><div class="ot-2">王菲把它<span class="acc">唱成命</span></div></div>
<div id="sub_ot1" class="sub clip" data-start="1.2" data-duration="6.675" data-track-index="12">林夕给王菲写过很多歌。<br>有些写爱，有些写孤独，有些写放下。</div>
<div id="sub_ot2" class="sub clip" data-start="8.075" data-duration="5.65" data-track-index="12">但他好像一直在替王菲，<br>搭一座桥：</div>
<div id="sub_ot3" class="sub clip" data-start="13.825" data-duration="5.4" data-track-index="12">从人间，到暗涌；从执念，到空；<br>最后，走到彼岸。</div>
<div id="sub_ot4" class="sub clip" data-start="19.625" data-duration="6.875" data-track-index="12">王菲最迷人的地方，<br>从来不只是声音。</div>
<div id="sub_ot5" class="sub clip" data-start="26.7" data-duration="6.1" data-track-index="12">而是林夕给了她一套语言，<br>她又把它唱成了自己的命。</div>
<div id="sub_ot6" class="sub clip" data-start="33.6" data-duration="5.25" data-track-index="12">你心里，林夕写给王菲<br>最封神的一首，是哪一首？</div>
<div id="cta" class="ot-cta clip" data-start="33.6" data-duration="7.35" data-track-index="19">《红豆》《暗涌》，还是《彼岸花》？</div>
